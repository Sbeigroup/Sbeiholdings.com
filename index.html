<style>
:root{--bg:#F2F4F2;--surface:#FFFFFF;--ink:#10222A;--muted:#55636A;--green:#0B2E3A;--on-green:#F4F6F3;--gold:#8A5A38;--silver:#C99B78;--line:#D3DAD7;--ug:linear-gradient(100deg,#6E4630,#A8734E 50%,#6E4630);--metal:linear-gradient(100deg,#7C5034,#D6AE8E 38%,#B98962 55%,#7C5034);
--serif:"Noto Naskh Arabic","Playfair Display",Georgia,serif;--sans:"Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07171C;--surface:#0E2730;--ink:#EEF0EA;--muted:#A3B0B2;--green:#051E27;--on-green:#F4F6F3;--gold:#D6AE8E;--silver:#C99B78;--line:#1F3A45;--ug:linear-gradient(100deg,#C99B78,#EBCBAE 50%,#C99B78);--metal:linear-gradient(100deg,#7C5034,#D6AE8E 38%,#B98962 55%,#7C5034);}}
:root[data-theme="dark"]{--bg:#07171C;--surface:#0E2730;--ink:#EEF0EA;--muted:#A3B0B2;--green:#051E27;--on-green:#F4F6F3;--gold:#D6AE8E;--silver:#C99B78;--line:#1F3A45;--ug:linear-gradient(100deg,#C99B78,#EBCBAE 50%,#C99B78);--metal:linear-gradient(100deg,#7C5034,#D6AE8E 38%,#B98962 55%,#7C5034);}
html{scroll-padding-top:calc(96px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.8;font-size:17px}
html[lang="en"] body{line-height:1.65}
a{color:inherit}
:focus-visible{outline:3px solid var(--silver);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--green);color:var(--on-green)}
header .wrap{display:flex;align-items:center;justify-content:space-between;min-height:60px;padding-block:6px;gap:12px}
.brand{font-family:"El Messiri","Noto Naskh Arabic",Georgia,serif;font-weight:700;font-size:clamp(20px,5.9vw,25.5px);letter-spacing:.01em;text-decoration:none;white-space:nowrap;color:#C6CEDA;background:linear-gradient(100deg,#AEB8C6,#F0F3F7 45%,#C6CEDA 70%,#AEB8C6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
nav{display:flex;gap:18px;font-size:15px;overflow-x:auto}
nav a{text-decoration:none;opacity:.85;white-space:nowrap}
nav a:hover{opacity:1;color:var(--silver)}
#lang{font:inherit;font-size:14px;font-weight:600;background:transparent;color:var(--on-green);border:1px solid var(--silver);border-radius:6px;padding:4px 12px;cursor:pointer}
#lang:hover{background:var(--silver);color:var(--green)}
.hero{background:radial-gradient(ellipse at 75% 40%,#134556 0%,var(--green) 65%);color:var(--on-green);overflow:hidden;position:relative}
.hero .wrap{padding-top:56px;padding-bottom:64px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:center}
.hero .logo{width:100%;max-width:320px;justify-self:center;display:block;margin:0;container-type:inline-size;filter:drop-shadow(0 8px 28px rgba(0,0,0,.45))}
.logo img{display:block;width:100%;height:auto}.logo figcaption{text-align:center;margin-top:4px}.hl{display:inline-block;font-family:"Lato",system-ui,sans-serif;font-size:clamp(14px,6.8cqw,22px);letter-spacing:.16em;color:#D6AE8E;background:linear-gradient(100deg,#C99B78,#EBCBAE 45%,#D6AE8E 70%,#C99B78);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-inline-start:.16em}.wm{position:relative;container-type:inline-size}
@media(max-width:800px){.hero .wrap{grid-template-columns:1fr}.hero .logo{order:-1;max-width:210px}}
h1{font-family:var(--serif);font-size:clamp(34px,6vw,60px);line-height:1.25;margin:16px 0 14px;max-width:16em}
.yr{color:#D6AE8E;background:linear-gradient(100deg,#C99B78,#EBCBAE 45%,#D6AE8E 70%,#C99B78);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1::after{content:"";display:block;width:84px;height:2px;background:var(--metal);margin-top:16px}
.hero p{max-width:38em;font-size:19px;opacity:.9;margin:0}
.cities{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.cities span{border:1px solid var(--silver);border-radius:999px;padding:4px 16px;font-size:15px}
section{padding:64px 0}
h2{font-family:var(--serif);font-size:clamp(28px,4vw,40px);margin:0 0 22px;line-height:1.3}
.lead{max-width:44em;color:var(--muted);margin:0}
.vm{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0;border-block:1px solid var(--line)}
.vm div{padding:28px 0}
.vm div+div{border-inline-start:1px solid var(--line);padding-inline-start:28px}
@media(max-width:640px){.vm div+div{border-inline-start:0;border-top:1px solid var(--line);padding-inline-start:0}}
h3{font-family:var(--serif);font-size:24px;margin:0 0 8px;color:var(--gold)}
.vm p{margin:0}
.city-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.city{background:var(--surface);border-top:4px solid;border-image:var(--metal) 1;padding:22px}
.city h3{color:var(--ink)}.city small{display:block;color:var(--gold);font-weight:600;margin-bottom:8px}
.city p{margin:0;color:var(--muted);font-size:16px}
.unit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px 40px;padding:30px 0;border-top:1px solid var(--line)}
@media(max-width:720px){.unit{grid-template-columns:1fr}}
.unit h3{font-size:26px;margin:0;width:fit-content;color:#8A5A38;background:var(--ug);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.unit .en{color:var(--muted);font-weight:600;font-size:15px;direction:ltr;text-align:start}
.unit .where{color:var(--muted);font-size:15px;margin-top:6px}
.unit p{margin:0 0 12px}
.mail{display:inline-block;direction:ltr;font-weight:600;color:var(--muted);text-decoration:none;border-bottom:1px solid currentColor}
.unit.hq{background:var(--surface);padding:30px 22px;border:1px solid var(--line)}
footer{background:var(--green);color:var(--on-green);padding:40px 0;font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.brand{display:inline-flex;flex-direction:column;align-items:center;line-height:1.02}.brand .b2{margin-top:.35em}.brand .b0,.brand .b1,.brand .b2{font-family:"Markazi Text","El Messiri",serif}.brand .b0,.brand .b2{font-size:.72em;font-weight:500}.brand .b1{font-size:1.38em;font-weight:700}
footer .wrap{flex-direction:column;align-items:flex-start;gap:14px}footer .nm{display:flex;flex-direction:column;align-items:flex-start;gap:4px}footer .brand{font-size:20px;flex-direction:row;align-items:baseline;column-gap:.32em;line-height:1.2}footer .brand .b0,footer .brand .b1,footer .brand .b2{font-size:1em;font-weight:700;margin:0}footer .cities{font-size:13.5px;opacity:.8}@media(min-width:721px){footer .wrap{flex-direction:row;justify-content:space-between;align-items:center}}
footer strong{font-family:"El Messiri","Noto Naskh Arabic",Georgia,serif;font-size:19px;letter-spacing:.01em;color:#C6CEDA;background:linear-gradient(100deg,#AEB8C6,#F0F3F7 45%,#C6CEDA 70%,#AEB8C6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}footer a{color:var(--silver)}
@media(max-width:720px){header .wrap{flex-wrap:wrap;height:auto;padding-top:8px;padding-bottom:8px;row-gap:4px}nav{order:3;width:100%;justify-content:space-between;gap:6px;overflow:visible;font-size:14.5px;border-top:1px solid rgba(255,255,255,.14);padding-top:6px}html{scroll-padding-top:calc(124px + env(safe-area-inset-top,0px))}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
